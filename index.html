<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart School Comm-Book | Mela Solution</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <style>
    body {
      background: radial-gradient(circle at top right, #1e113a, #0b0f19 70%);
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
    }
    .glass-panel {
      background: rgba(26, 20, 53, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(139, 92, 246, 0.25);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .btn-3d {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border: none;
      box-shadow: 0 6px 0 #3730a3, 0 10px 20px rgba(0,0,0,0.4);
      transition: all 0.1s ease;
      color: #ffffff;
      font-weight: bold;
    }
    .btn-3d:active { transform: translateY(4px); box-shadow: 0 2px 0 #3730a3; }
    .btn-3d-secondary {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      box-shadow: 0 6px 0 #020617, 0 10px 20px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-3d-secondary:active { transform: translateY(4px); box-shadow: 0 2px 0 #020617; }
    .btn-3d-admin {
      background: linear-gradient(135deg, #ec4899, #be185d);
      box-shadow: 0 6px 0 #831843, 0 10px 20px rgba(236, 72, 153, 0.4);
      color: white;
    }
    .btn-3d-admin:active { transform: translateY(4px); box-shadow: 0 2px 0 #831843; }
    .avatar-3d {
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      border: 3px solid #8b5cf6;
    }
  </style>
</head>
<body class="p-3 md:p-8 flex flex-col justify-between min-h-screen">

  <div>
    <!-- Header -->
    <header class="max-w-7xl mx-auto flex flex-wrap justify-between items-center mb-6 glass-panel p-4 rounded-2xl">
      <div class="flex items-center space-x-3">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center text-2xl shadow-lg">
          <i class="fas fa-graduation-cap text-white"></i>
        </div>
        <div>
          <h1 class="text-xl md:text-2xl font-black tracking-wide text-white">Smart Comm-Book</h1>
          <p id="roleTitle" class="text-xs text-purple-300">የመምህሩ ዳሽቦርድ (KG - Grade 12)</p>
        </div>
      </div>
      
      <div class="flex space-x-2 mt-4 md:mt-0">
        <button id="btnTeacherView" onclick="switchView('teacher')" class="btn-3d px-3 py-2 rounded-xl text-xs flex items-center gap-1.5">
          <i class="fas fa-chalkboard-teacher"></i> የመምህር ገጽ
        </button>
        <button id="btnAdminView" onclick="promptAdminLogin()" class="btn-3d-secondary px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 text-pink-400">
          <i class="fas fa-user-shield"></i> አድሚን ገጽ
        </button>
      </div>
    </header>

    <!-- Teacher Section -->
    <div id="teacherSection">
      <main class="max-w-7xl mx-auto">
        <div class="glass-panel p-4 md:p-6 rounded-2xl mb-6">
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-sm text-purple-200"><i class="fas fa-search mr-1"></i> ተማሪዎችን ፈልግ</h3>
            <button onclick="openModal('addModal')" class="btn-3d px-3 py-1.5 rounded-xl text-xs flex items-center gap-1">
              <i class="fas fa-camera"></i> አዲስ ተማሪ + ፎቶ
            </button>
          </div>
          
          <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
            <!-- Full KG to 12 Dropdown -->
            <div>
              <label class="block text-xs text-purple-300 mb-1 font-semibold">ክፍል (Grade)</label>
              <select id="filterGrade" class="w-full bg-slate-900 border border-purple-500/30 rounded-xl px-3 py-2 text-white text-xs">

                  <option value="KG 3">KG 3</option>

                <optgroup label="Primary (1-8)">
                  <option value="Grade 1">Grade 1</option>
                  <option value="Grade 2">Grade 2</option>
                  <option value="Grade 3">Grade 3</option>
                  <option value="Grade 4">Grade 4</option>
                  <option value="Grade 5">Grade 5</option>
                  <option value="Grade 6">Grade 6</option>
                  <option value="Grade 7">Grade 7</option>
                  <option value="Grade 8">Grade 8</option>
                </optgroup>
                <optgroup label="High School (9-12)">

                  <option value="Grade 10">Grade 10</option>
                  <option value="Grade 11">Grade 11</option>

              </select>
            </div>

            <div>
              <label class="block text-xs text-purple-300 mb-1 font-semibold">ሴክሽን (Section)</label>

                <option value="C">Section C</option>

              <input type="text" id="filterSearch" placeholder="ስም ወይም ID..." class="w-full bg-slate-900 border border-purple-500/30 rounded-xl px-3 py-2 text-white text-xs">
            </div>

            <div class="flex items-end">

                <i class="fas fa-search"></i> ፈልግ

            </div>
          </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="lg:col-span-1 space-y-3" id="studentsList">

          </div>

          <div class="lg:col-span-2 glass-panel p-4 md:p-6 rounded-2xl" id="profileCard">
            <div class="text-center py-16 text-slate-400 text-sm">ዝርዝር መረጃ ለማየት ከተማሪዎች ዝርዝር ውስጥ አንዱን ይምረጡ</div>
          </div>

          <div>
            <p class="text-xs text-purple-300 font-bold">ጠቅላላ ተማሪዎች</p>
            <h3 id="statStudents" class="text-2xl font-black text-white mt-1">...</h3>
          </div>
          <i class="fas fa-users text-2xl text-purple-400"></i>
        </div>

        <div class="glass-panel p-5 rounded-2xl border border-pink-500/30 flex justify-between items-center">
          <div>
            <p class="text-xs text-pink-300 font-bold">ቴሌግራም የተገናኙ</p>
            <h3 id="statTelegram" class="text-2xl font-black text-white mt-1">...</h3>
          </div>
          <i class="fab fa-telegram text-2xl text-pink-400"></i>
        </div>

        <div class="glass-panel p-5 rounded-2xl border border-blue-500/30 flex justify-between items-center">
          <div>
            <p class="text-xs text-blue-300 font-bold">የተላኩ መልእክቶች</p>
            <h3 id="statMessages" class="text-2xl font-black text-white mt-1">...</h3>
          </div>
          <i class="fas fa-envelope text-2xl text-blue-400"></i>
        </div>
      </div>

      <!-- Broadcast -->
      <div class="glass-panel p-6 rounded-2xl border border-pink-500/40">
        <h3 class="text-base font-bold text-white mb-2"><i class="fas fa-bullhorn text-pink-400 mr-1"></i> አጠቃላይ ማስታወቂያ ማሰራጫ</h3>
        <textarea id="broadcastText" rows="3" placeholder="የማስታወቂያውን ዝርዝር እዚህ ይፃፉ..." class="w-full bg-slate-900 border border-pink-500/30 rounded-xl p-3 text-white text-xs mb-3"></textarea>
        <button onclick="sendBroadcast()" id="broadcastBtn" class="btn-3d-admin w-full py-2.5 rounded-xl text-xs font-bold">
          <i class="fas fa-paper-plane mr-1"></i> ለሁሉም ወላጆች አሰራጭ
        </button>
        <div id="broadcastStatus" class="text-center text-xs mt-2 font-bold"></div>
      </div>
    </div>
  </div>

  <!-- Registration Modal with Auto-Compressor -->
  <div id="addModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 overflow-y-auto">
    <div class="glass-panel w-full max-w-lg p-5 rounded-2xl border border-purple-500/40 my-auto">
      <h2 class="text-base font-bold mb-3 text-white flex items-center gap-2">
        <i class="fas fa-camera text-purple-400"></i> አዲስ ተማሪ + ፎቶ ማንሻ
      </h2>
      <form id="addStudentForm" onsubmit="submitStudent(event)" class="space-y-3 text-xs">
        <div class="flex flex-col items-center justify-center p-3 bg-slate-900/60 rounded-xl border border-purple-500/20">
          <img id="photoPreview" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="w-20 h-20 rounded-full object-cover avatar-3d mb-2">
          <span id="compressStatus" class="text-[10px] text-green-400 mb-2"></span>
          <div class="flex gap-2">
            <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="processAndCompressImage(this)">
            <button type="button" onclick="document.getElementById('cameraInput').click()" class="btn-3d px-3 py-1.5 rounded-xl text-xs">
              <i class="fas fa-camera"></i> ፎቶ አንሳ
            </button>
            <input type="file" id="galleryInput" accept="image/*" class="hidden" onchange="processAndCompressImage(this)">
            <button type="button" onclick="document.getElementById('galleryInput').click()" class="btn-3d-secondary px-3 py-1.5 rounded-xl text-xs text-purple-300">
              <i class="fas fa-images"></i> ጋለሪ
            </button>
          </div>
        </div>
        
        <input type="text" id="regId" placeholder="የት/ቤት ተማሪ ID *" required class="w-full bg-slate-900 border border-purple-500/30 rounded-xl p-2 text-white">
        <input type="text" id="regName" placeholder="የተማሪ ሙሉ ስም *" required class="w-full bg-slate-900 border border-purple-500/30 rounded-xl p-2 text-white">

          <select id="regGrade" required class="bg-slate-900 border border-purple-500/30 rounded-xl p-2 text-white">
            <option value="">ክፍል ምረጥ *</option>
            <option value="KG 1">KG 1</option>
            <option value="KG 2">KG 2</option>
            <option value="KG 3">KG 3</option>
            <option value="Grade 1">Grade 1</option>
            <option value="Grade 2">Grade 2</option>
            <option value="Grade 3">Grade 3</option>
            <option value="Grade 4">Grade 4</option>
            <option value="Grade 5">Grade 5</option>
            <option value="Grade 6">Grade 6</option>
            <option value="Grade 7">Grade 7</option>
            <option value="Grade 8">Grade 8</option>
            <option value="Grade 9">Grade 9</option>
            <option value="Grade 10">Grade 10</option>
            <option value="Grade 11">Grade 11</option>
            <option value="Grade 12">Grade 12</option>
          </select>
          <select id="regSection" required class="bg-slate-900 border border-purple-500/30 rounded-xl p-2 text-white">
            <option value="A">Section A</option>
            <option value="B">Section B</option>
            <option value="C">Section C</option>
            <option value="D">Section D</option>
            <option value="E">Section E</option>
          </select>

        <input type="text" id="regParent" placeholder="የወላጅ ሙሉ ስም *" required class="w-full bg-slate-900 border border-purple-500/30 rounded-xl p-2 text-white">
        <div class="grid grid-cols-2 gap-2">
          <input type="tel" id="regPhone1" placeholder="ዋና ስልክ *" required class="bg-slate-900 border border-purple-500/30 rounded-xl p-2 text-white">
          <input type="tel" id="regPhone2" placeholder="ተጨማሪ ስልክ" class="bg-slate-900 border border-purple-500/30 rounded-xl p-2 text-white">
        </div>
        
        <textarea id="regStatus" placeholder="ጠቅላላ ሁኔታ / ማስታወሻ..." class="w-full bg-slate-900 border border-purple-500/30 rounded-xl p-2 text-white h-14"></textarea>

  <!-- Admin Modal -->
  <div id="adminLoginModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="glass-panel w-full max-w-xs p-5 rounded-2xl text-center border border-pink-500/40">
      <i class="fas fa-lock text-3xl text-pink-400 mb-2"></i>
      <h3 class="text-base font-bold text-white mb-2">የአድሚን መግቢያ</h3>
      <input type="password" id="adminPinInput" placeholder="admin123" class="w-full bg-slate-900 border border-pink-500/40 rounded-xl p-2 text-center text-white mb-3">
      <div class="flex gap-2">
        <button onclick="closeModal('adminLoginModal')" class="btn-3d-secondary w-1/2 py-1.5 rounded-xl text-xs">ይቅር</button>
        <button onclick="checkAdminPin()" class="btn-3d-admin w-1/2 py-1.5 rounded-xl text-xs">ግባ</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="max-w-7xl mx-auto w-full mt-8 mb-2 glass-panel p-3 rounded-2xl text-center text-xs">
    <p class="font-bold text-purple-300">Mela Solution 🚀 | <a href="tel:+251913064239">+251 913 064 239</a> | <a href="tel:+251703064239">+251 703 064 239</a></p>
  </footer>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz94b3Zhq3zNnO7sUpy6mpwF4otBK73bpTs2ZYIjDd2pogvdyrwKp_r9dgClyVKBwbdMA/exec";

    let loadedStudents = [];
    let currentStudent = null;
    let selectedImageBase64 = "";

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function switchView(role) {
      if (role === 'admin') {
        document.getElementById('teacherSection').classList.add('hidden');
        document.getElementById('adminSection').classList.remove('hidden');
        document.getElementById('roleTitle').innerText = "የአድሚን ዳሽቦርድ (Admin Mode)";
        fetchAdminStats();
      } else {
        document.getElementById('adminSection').classList.add('hidden');
        document.getElementById('teacherSection').classList.remove('hidden');
        document.getElementById('roleTitle').innerText = "የመምህሩ ዳሽቦርድ (KG - Grade 12)";
      }
    }

    function promptAdminLogin() { openModal('adminLoginModal'); }
    function checkAdminPin() {
      const pin = document.getElementById('adminPinInput').value;
      if (pin === "admin123" || pin === "2025") {
        closeModal('adminLoginModal');
        document.getElementById('adminPinInput').value = "";
        switchView('admin');
      } else {
        alert("የተሳሳተ የይለፍ ቃል!");
      }
    }

    // 🌟 AUTOMATIC IMAGE COMPRESSOR (< 80KB) 🌟
    function processAndCompressImage(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const statusSpan = document.getElementById('compressStatus');
        statusSpan.innerText = "ፎቶው እየቀነሰ ነው...";

        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxDim = 500; // 500px max width/height

            if (width > height && width > maxDim) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else if (height > maxDim) {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // Compress to JPEG with 70% quality (~40KB - 70KB)
            selectedImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
            document.getElementById('photoPreview').src = selectedImageBase64;
            statusSpan.innerText = "✅ ፎቶው ወደ KB ዝቅ ብሏል!";
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function performSearch() {
      const grade = document.getElementById('filterGrade').value;
      const section = document.getElementById('filterSection').value;
      const query = document.getElementById('filterSearch').value;
      const listContainer = document.getElementById('studentsList');
      
      listContainer.innerHTML = `<div class="p-6 text-center text-purple-300 text-xs"><i class="fas fa-spinner fa-spin text-lg mb-1"></i><p>እየተፈለገ ነው...</p></div>`;

      fetch(`${SCRIPT_URL}?action=search&grade=${encodeURIComponent(grade)}&section=${encodeURIComponent(section)}&query=${encodeURIComponent(query)}`)
        .then(res => res.json())
        .then(data => {
          loadedStudents = data || [];
          renderStudentsList();
        })
        .catch(err => {
          listContainer.innerHTML = `<div class="text-red-400 text-xs text-center p-4">መረጃውን ማምጣት አልተቻለም።</div>`;
        });
    }

    function renderStudentsList() {
      const container = document.getElementById('studentsList');
      if (!loadedStudents || loadedStudents.length === 0) {
        container.innerHTML = `<div class="glass-panel p-4 text-center text-slate-400 rounded-xl text-xs">ምንም ተማሪ አልተገኘም!</div>`;
        return;
      }

      container.innerHTML = loadedStudents.map((s, idx) => `
        <div onclick="selectStudentByIndex(${idx})" class="glass-panel p-3 rounded-xl cursor-pointer hover:border-purple-400 transition flex items-center space-x-3">
          <img src="${s.photoUrl}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'" class="w-10 h-10 rounded-full object-cover avatar-3d">
          <div class="flex-1 min-w-0">
            <h4 class="font-bold text-white text-xs truncate">${s.name}</h4>
            <p class="text-[10px] text-purple-300">ID: ${s.id} | ${s.grade} - ${s.section}</p>
          </div>
          <i class="fas fa-chevron-right text-[10px] text-purple-400"></i>
        </div>
      `).join('');
    }

    function selectStudentByIndex(index) {
      currentStudent = loadedStudents[index];
      if (!currentStudent) return;
      const container = document.getElementById('profileCard');
      
      const tgStatus = currentStudent.chatId ? 
        `<span class="text-green-400 text-[10px] font-bold"><i class="fas fa-check-circle"></i> ቴሌግራም ተገናኝቷል</span>` : 
        `<span class="text-amber-400 text-[10px] font-bold"><i class="fas fa-exclamation-triangle"></i> ገና ቴሌግራም አልተገናኘም</span>`;

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row items-center gap-4 pb-4 border-b border-purple-500/20">
          <img src="${currentStudent.photoUrl}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'" class="w-24 h-24 rounded-2xl object-cover avatar-3d">
          <div class="text-center sm:text-left space-y-1">
            <span class="px-2 py-0.5 bg-purple-900/60 border border-purple-400/40 text-purple-200 text-[10px] rounded-full font-bold">ID: ${currentStudent.id}</span>
            <h2 class="text-lg font-bold text-white">${currentStudent.name}</h2>
            <p class="text-xs text-purple-300 font-semibold">${currentStudent.grade} | ክፍል: ${currentStudent.section}</p>
            <p class="text-[11px] text-slate-300"><i class="fas fa-user-shield text-purple-400 mr-1"></i> ወላጅ፡ ${currentStudent.parentName} (${currentStudent.phone1})</p>
            <div>${tgStatus}</div>
          </div>
        </div>

        <div class="my-4 p-3 rounded-xl bg-slate-900/60 border border-purple-500/20">
          <label class="block text-[10px] font-bold text-purple-300 uppercase mb-1">ስለ ልጁ ጠቅላላ ሁኔታ</label>
          <p class="text-xs text-slate-200">${currentStudent.status}</p>
        </div>

        <div class="space-y-2">
          <label class="block text-[10px] font-bold text-purple-300 uppercase">ለወላጅ በቴሌግራም መልእክት መላኪያ</label>
          <textarea id="tgMessageText" rows="2" placeholder="የዛሬ ውሎ ወይም ውጤት እዚህ ይፃፉ..." class="w-full bg-slate-900/90 border border-purple-500/30 rounded-xl p-2.5 text-white text-xs"></textarea>
          <button onclick="sendDirectMessage()" class="btn-3d w-full py-2.5 rounded-xl flex justify-center items-center gap-2 text-xs">
            <i class="fab fa-telegram-plane text-sm"></i> መልእክት ላክ (Send)
          </button>
          <div id="msgStatus" class="text-center text-xs mt-1"></div>
        </div>
      `;
    }

    function sendDirectMessage() {
      if (!currentStudent) return alert("እባክዎ መጀመሪያ ተማሪ ይምረጡ!");
      const msg = document.getElementById('tgMessageText').value;
      const statusDiv = document.getElementById('msgStatus');
      if (!msg.trim()) return alert("እባክዎ መጀመሪያ መልእክት ይፃፉ!");
      
      statusDiv.innerHTML = `<span class="text-purple-300"><i class="fas fa-spinner fa-spin"></i> እየተላከ ነው...</span>`;
      
      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "sendMessage",
          chatId: currentStudent.chatId,
          message: `<b>[የትምህርት ቤት መልእክት]</b>\nተማሪ: <b>${currentStudent.name}</b>\n\n${msg}`
        })
      })
      .then(res => res.json())
      .then(res => {
        if(res.success) {
          statusDiv.innerHTML = `<span class="text-green-400 font-bold"><i class="fas fa-check-circle"></i> ተልኳል!</span>`;
          document.getElementById('tgMessageText').value = "";
        } else {
          statusDiv.innerHTML = `<span class="text-red-400 font-bold">አልተላከም: ${res.error}</span>`;
        }
      });
    }

    function submitStudent(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('saveStudentBtn');
      saveBtn.innerText = "እየተመዘገበ ነው...";
      saveBtn.disabled = true;

      const studentData = {
        id: document.getElementById('regId').value,
        name: document.getElementById('regName').value,
        grade: document.getElementById('regGrade').value,
        section: document.getElementById('regSection').value,
        parentName: document.getElementById('regParent').value,
        phone1: document.getElementById('regPhone1').value,
        phone2: document.getElementById('regPhone2').value,
        photoBase64: selectedImageBase64,
        status: document.getElementById('regStatus').value
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "registerSingle", student: studentData })
      })
      .then(res => res.json())
      .then(res => {
        alert(res.message);
        closeModal('addModal');
        document.getElementById('addStudentForm').reset();
        document.getElementById('photoPreview').src = "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
        document.getElementById('compressStatus').innerText = "";
        selectedImageBase64 = "";
        saveBtn.innerText = "መዝግብ";
        saveBtn.disabled = false;
        performSearch();
      });
    }

    function fetchAdminStats() {
      fetch(`${SCRIPT_URL}?action=getAdminStats`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('statStudents').innerText = data.totalStudents || 0;
          document.getElementById('statTelegram').innerText = data.telegramConnected || 0;
          document.getElementById('statMessages').innerText = data.totalMessages || 0;
        });
    }

    function sendBroadcast() {
      const text = document.getElementById('broadcastText').value;
      const statusDiv = document.getElementById('broadcastStatus');
      const btn = document.getElementById('broadcastBtn');
      if (!text.trim()) return alert("እባክዎ የማስታወቂያ መልእክት ይፃፉ!");
      btn.disabled = true;
      statusDiv.innerHTML = `<span class="text-pink-300"><i class="fas fa-spinner fa-spin"></i> እየተላከ ነው...</span>`;
      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "broadcastMessage", targetGrade: "ALL", message: text })
      })
      .then(res => res.json())
      .then(res => {
        btn.disabled = false;
        if (res.success) {
          statusDiv.innerHTML = `<span class="text-green-400 font-bold">ለ ${res.sentCount} ወላጆች ተልኳል!</span>`;
          document.getElementById('broadcastText').value = "";
          fetchAdminStats();
        } else {
          statusDiv.innerHTML = `<span class="text-red-400 font-bold">ስህተት፡ ${res.error}</span>`;
        }
      });
    }
  </script>
</body>
</html>
